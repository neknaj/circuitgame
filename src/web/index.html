<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Circuit Game</title>
        <link rel="icon" href="favicon.ico" type="image/x-icon">
        <link rel="icon" href="icon.png" type="image/png" sizes="1020x1020">
        <meta name="theme-color" content="#0a0a0b">
        <style>
            :root {
                color-scheme: dark;
            }

            html, body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #0a0a0b;
            }

            body {
                font-family: monospace;
            }

            #app {
                width: 100%;
                height: 100%;
            }

            #circuitgame-egui {
                width: 100%;
                height: 100%;
                display: block;
            }

            #loading {
                position: fixed;
                inset: 0;
                display: grid;
                place-items: center;
                color: #d7d7d7;
                letter-spacing: 0.08em;
                pointer-events: none;
            }
        </style>
    </head>
    <body>
        <div id="app">
            <canvas id="circuitgame-egui"></canvas>
            <div id="loading">Loading CircuitGame...</div>
        </div>
        <script type="module">
            import init from "./circuitgame_lib.js";

            await init();
            document.getElementById("loading")?.remove();
        </script>
    </body>
</html>
